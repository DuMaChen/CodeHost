# Reference template used by the trusted Worker when it creates one Run
# Namespace. RUN_NAMESPACE is generated by the platform, never accepted as a
# user-provided Kubernetes manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: ${RUN_NAMESPACE}
  labels:
    platform.io/managed: "true"
    platform.io/run-id: ${RUN_ID}
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ${RUN_NAMESPACE}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: run-quota
  namespace: ${RUN_NAMESPACE}
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 3Gi
    limits.memory: 6Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 6Gi
    count/pods: "8"
    count/jobs.batch: "4"
    count/deployments.apps: "1"
    count/services: "2"
    count/persistentvolumeclaims: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: run-defaults
  namespace: ${RUN_NAMESPACE}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
      default:
        cpu: "1"
        memory: 1Gi
        ephemeral-storage: 1Gi

