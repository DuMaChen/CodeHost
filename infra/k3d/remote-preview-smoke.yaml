apiVersion: v1
kind: Namespace
metadata:
  name: platform-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview
  namespace: platform-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preview
          image: platform-preview:remote
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: preview
  namespace: platform-smoke
spec:
  selector:
    app.kubernetes.io/name: preview
  ports:
    - name: http
      port: 8080
      targetPort: http
